# Reviewed example only: apply separately to the intended child, never through the controller chart.
apiVersion: v1
kind: Namespace
metadata:
  name: requestor-identity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuer
  namespace: requestor-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-one
  namespace: requestor-identity
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: requestor-issuer
  namespace: requestor-identity
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [ca-one]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [issuer, ca-one]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: requestor-issuer
  namespace: requestor-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: requestor-issuer
subjects:
  - kind: ServiceAccount
    name: issuer
    namespace: requestor-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: requestor-identity-review
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [authentication.k8s.io]
    resources: [selfsubjectreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: requestor-identity-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: requestor-identity-review
subjects:
  - kind: ServiceAccount
    name: issuer
    namespace: requestor-identity
  - kind: ServiceAccount
    name: ca-one
    namespace: requestor-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: requestor-ca-identity
  namespace: requestor-identity
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [ca-one]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: requestor-ca-identity
  namespace: requestor-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: requestor-ca-identity
subjects:
  - kind: ServiceAccount
    name: ca-one
    namespace: requestor-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: requestor-ca-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, replicationcontrollers, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, replicasets, statefulsets, deployments]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers, csistoragecapacities, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims, resourceclaimtemplates, resourceslices, deviceclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: requestor-ca-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: requestor-ca-read
subjects:
  - kind: ServiceAccount
    name: ca-one
    namespace: requestor-identity

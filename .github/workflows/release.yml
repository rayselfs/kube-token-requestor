name: Paired GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version (for example v0.1.0-rc.1); stable requires accepted evidence'
        required: true
        type: string
      acceptance_artifact_id:
        description: 'Required for stable: owner-approved report artifact from this exact main commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  ACCEPTANCE_ID: ${{ inputs.acceptance_artifact_id }}
  VERSION: ${{ inputs.version }}
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: ghcr.io/${{ github.repository_owner }}/charts/kube-token-requestor

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gate exact source and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          args=()
          if [[ "$VERSION" != *-rc.* ]]; then
            python scripts/acceptance.py --id "$ACCEPTANCE_ID" --repository "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/acceptance.json"
            args=(--evidence "$RUNNER_TEMP/acceptance.json")
          fi
          python scripts/release.py gate --version "$VERSION" --commit "$GITHUB_SHA" "${args[@]}"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs' > "$RUNNER_TEMP/checks.json"
          CHECKS="$RUNNER_TEMP/checks.json" python - <<'PY_CHECKS'
          import json, os
          checks = json.load(open(os.environ['CHECKS']))
          for name in ('go', 'spec'):
            assert any(c['name'] == name and c['status'] == 'completed' and c['conclusion'] == 'success' for c in checks), 'Required source CI has not passed'
          PY_CHECKS
          python scripts/check-spec.py
          python -m unittest discover -s scripts -p 'test_*.py'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" > "$RUNNER_TEMP/tag.json" 2> "$RUNNER_TEMP/tag-error"; then
            echo 'Existing tags must never be overwritten'; exit 1
          elif ! grep -q '(HTTP 404)' "$RUNNER_TEMP/tag-error"; then
            echo 'Tag lookup failed; publication stopped'; exit 1
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "$VERSION — verification pending" --notes 'Paired artifact publication is incomplete until registry/signature/platform/chart checks pass. Production acceptance is recorded separately; this draft authorizes no cluster deployment.'

  artifacts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Check and build paired binaries
        run: |
          set -euo pipefail
          go test -race ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
          go install github.com/google/go-licenses/v2@v2.0.1
          mkdir -p dist
          go-licenses check --allowed_licenses=Apache-2.0,BSD-3-Clause,ISC,MIT ./cmd/kube-token-requestor
          go-licenses report ./cmd/kube-token-requestor > dist/licenses.csv
          for arch in amd64 arm64; do
            mkdir -p "dist/linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${VERSION#v}" -o "dist/linux-$arch/kube-token-requestor" ./cmd/kube-token-requestor
          done
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Refuse existing OCI version tags
        run: |
          set -euo pipefail
          for ref in "$IMAGE:$VERSION" "$CHART:${VERSION#v}"; do
            if docker buildx imagetools inspect "$ref" > "$RUNNER_TEMP/oci-check" 2>&1; then
              echo 'Existing OCI version must never be overwritten'; exit 1
            elif ! grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/oci-check"; then
              echo 'OCI lookup failed; publication stopped'; exit 1
            fi
          done
      - name: Publish immutable multiarchitecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Scan, package, sign and record artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            trivy image --platform "linux/$arch" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE@$IMAGE_DIGEST"
            trivy image --platform "linux/$arch" --format spdx-json --output "dist/image-linux-$arch.spdx.json" "$IMAGE@$IMAGE_DIGEST"
          done
          cp -R charts/kube-token-requestor "$RUNNER_TEMP/chart"
          IMAGE_DIGEST="$IMAGE_DIGEST" python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'chart/values.yaml'
          s = p.read_text()
          assert s.count('  digest: ""') == 1
          s, count = re.subn(r'^  repository: .*$', '  repository: ' + os.environ['IMAGE'], s, flags=re.MULTILINE)
          assert count == 1
          p.write_text(s.replace('  digest: ""', '  digest: "' + os.environ['IMAGE_DIGEST'] + '"'))
          PY
          helm lint "$RUNNER_TEMP/chart"
          helm package "$RUNNER_TEMP/chart" --version "${VERSION#v}" --app-version "${VERSION#v}" --destination dist
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kube-token-requestor-${VERSION#v}.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts" > "$RUNNER_TEMP/chart-push" 2>&1
          CHART_DIGEST=$(sed -n 's/^Digest: \(sha256:[0-9a-f]*\)$/\1/p' "$RUNNER_TEMP/chart-push")
          test -n "$CHART_DIGEST"
          cosign sign --yes --bundle dist/image.sigstore.json "$IMAGE@$IMAGE_DIGEST"
          cosign sign --yes --bundle dist/chart.sigstore.json "$CHART@$CHART_DIGEST"
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/image-index.json"
          args=()
          if [[ "$VERSION" != *-rc.* ]]; then
            python scripts/acceptance.py --id "$ACCEPTANCE_ID" --repository "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/acceptance.json"
            args=(--evidence "$RUNNER_TEMP/acceptance.json")
          fi
          python scripts/release.py manifest --version "$VERSION" --commit "$GITHUB_SHA" --image "$IMAGE" --chart "$CHART" --image-digest "$IMAGE_DIGEST" --chart-digest "$CHART_DIGEST" --index "$RUNNER_TEMP/image-index.json" --assets dist "${args[@]}"
          cosign sign-blob --yes --bundle dist/manifest.sigstore.json dist/release-manifest.json
          (cd dist && sha256sum *.json *.tgz licenses.csv > checksums.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*.json
            dist/*.tgz
            dist/licenses.csv
            dist/checksums.sha256
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Verify anonymous pull, native startup and Helm lifecycle
        env:
          ARCH: ${{ matrix.arch }}
        run: scripts/release-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.arch }}
          path: dist/smoke-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Remove only the task-owned kind cluster
        if: always()
        run: |
          if command -v kind >/dev/null; then kind delete cluster --name requestor-release; fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'smoke-*'
          path: dist
          merge-multiple: true
      - name: Publish verified paired release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do test -f "dist/smoke-$arch.json"; done
          gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY"
          prerelease=true
          if [[ "$VERSION" != *-rc.* ]]; then prerelease=false; fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$prerelease" --title "$VERSION" --notes 'Verified paired image/chart with native amd64/arm64 anonymous pulls, signatures, SPDX SBOMs and Helm install/upgrade/uninstall/reinstall smoke. See release-manifest.json for exact source/digests and support status. Experimental RC artifacts do not claim production acceptance or authorize external deployment.'

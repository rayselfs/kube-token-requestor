name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: go test ./internal/config -run '^$' -fuzz FuzzParse -fuzztime 10s
      - run: go run ./cmd/kube-token-requestor validate-config < examples/registry.json
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

name: Synthetic JWT API acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published paired release to test with actual kubelet subject projection
        required: true
        default: v0.1.0-rc.6
        type: string
  push:
    paths:
      - 'integration/oidc/**'
      - 'internal/provider/**'
      - 'internal/issue/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/oauth-acceptance.yml'
      - 'scripts/oauth-projection.sh'
  pull_request:
    paths:
      - 'integration/oidc/**'
      - 'internal/provider/**'
      - 'internal/issue/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/oauth-acceptance.yml'
      - 'scripts/oauth-projection.sh'

permissions:
  contents: read

concurrency:
  group: jwt-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jwt-api:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - run: go install sigs.k8s.io/kind@v0.33.0
      - name: Real synthetic JWT API and restricted TokenRequest
        env:
          REQUESTOR_OIDC_API: '1'
        run: go test -v -count=1 -timeout=15m ./integration/oidc -run '^TestActualKubernetes$'

  projection-api:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Published controller and actual kubelet subject rotation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.1.0-rc.6' }}
        run: scripts/oauth-projection.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: oauth-projection-${{ matrix.runner }}
          path: ${{ runner.temp }}/oauth-projection/evidence.json
          if-no-files-found: error
          retention-days: 30

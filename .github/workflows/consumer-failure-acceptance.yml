name: Consumer failure isolation acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published paired release containing the consumer isolation fix
        required: true
        default: v0.1.0-rc.7
        type: string

permissions:
  contents: read

concurrency:
  group: consumer-failure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumer-failure:
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Actual denied emergency stop with five independent healthy consumers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTOR_CAPACITY_CHILDREN: '2'
          REQUESTOR_CAPACITY_PROFILE: consumer-failure
        run: scripts/capacity-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: consumer-failure-${{ matrix.runner }}
          path: ${{ runner.temp }}/capacity/evidence.json
          if-no-files-found: error
          retention-days: 30

name: Independent API capacity acceptance

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published paired release for actual capacity acceptance
        required: true
        default: v0.1.0-rc.6
        type: string
      children:
        description: Actual independent APIs; smoke is not 20-child acceptance
        type: choice
        options: ['20', '2']
        default: '20'
  pull_request:
    paths:
      - 'integration/capacity/**'
      - 'scripts/capacity-acceptance.sh'
      - '.github/workflows/capacity-acceptance.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capacity-api:
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.9'
          cache: false
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Published controller with separate real child APIs and actual CA processes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'v0.1.0-rc.6' }}
          REQUESTOR_CAPACITY_CHILDREN: ${{ inputs.children || '2' }}
        run: scripts/capacity-acceptance.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: independent-api-capacity-${{ inputs.children || '2' }}
          path: ${{ runner.temp }}/capacity/evidence.json
          if-no-files-found: error
          retention-days: 30
